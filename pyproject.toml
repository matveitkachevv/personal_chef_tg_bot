[project]
name = "personal-chef"
version = "0.1.0"
description = "Телеграм бот 'Персональный повар' для подбора рецептов и составления меню"
readme = "README.md"
authors = [
    { name = "matveitkachevv", email = "matveitckachevv@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
personal-chef = "personal_chef.main:run"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
