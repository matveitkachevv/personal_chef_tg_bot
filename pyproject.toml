[project]
name = "personal-chef"
version = "0.1.0"
description = "Телеграм бот 'Персональный повар' для подбора рецептов и составления меню"
readme = "README.md"
authors = [
    { name = "matveitkachevv", email = "matveitckachevv@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "greenlet>=3.5.6",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-postgres>=3.2.0",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
personal-chef = "personal_chef.main:run"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
